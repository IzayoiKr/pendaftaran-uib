root = "."
tmp_dir = "tmp"
[build]
    cmd = "go build -o ./tmp/server ./cmd/server"
    bin = "./tmp/server"
    entrypoint = "./tmp/server"
    delay = 1000
    exclude_dir = ["tmp", "vendor", "migrations", ".git"]
    include_ext = ["go", "tpl", "tmpl", "html"]
    exclude_regex = []
    stop_on_error = true
    send_interrupt = true

[log]
    time = true

[color]
    main = "magenta"
    watcher = "cyan"
    build = "yellow"
    runner = "green"
