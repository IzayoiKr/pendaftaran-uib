services:
  mysql:
    image: mysql:8.0
    container_name: mysql-pendaftaran-uib-dev
    command: --port=${MYSQL_PORT}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - ${MYSQL_PORTS}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "mysql",
          "-P",
          "${MYSQL_PORT}",
          "-u",
          "${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: mongodb-pendaftaran-uib-dev
    command: >
      mongod
        --port ${MONGO_PORT}
        --auth
        --quiet
        --setParameter logComponentVerbosity={"storage":{"verbosity":-1}}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - ${MONGO_PORTS}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --port ${MONGO_PORT}
          --username "${MONGO_INITDB_ROOT_USERNAME}"
          --password "${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping')"
          --quiet
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: development
    container_name: migrate-pendaftaran-uib-dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: ${MYSQL_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    command: >-
      migrate
      -path /app/migrations
      -database "mysql://${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}"
      up

  backend:
    build:
      context: ./backend
      target: development
    container_name: backend-pendaftaran-uib-dev
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: ${MYSQL_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:${MONGO_PORT}
      MONGO_DB: ${MONGO_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: ${SERVER_PORT}
    ports:
      - ${BACKEND_PORTS}
    volumes:
      - ./backend:/app
      - /app/tmp
    command: air -c .air.toml

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend-pendaftaran-uib-dev
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - ${FRONTEND_PORTS}
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
  mongo_data:
